name = "Zeta5Irr"
defaultTargets = ["Zeta5Irr"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AxiomMath/PrimeNumberTheoremAnd.git"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Zeta5Irr"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact), and `lake lint` derives its
# scope from the default targets. The comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
